services:
  postgres:
    ports:
      - "5432:5432"
    restart: unless-stopped

  n8n:
    ports:
      - "5678:5678"
    restart: unless-stopped
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

  filter:
    ports:
      - "3000:3000"
    restart: unless-stopped

  dashboard:
    ports:
      - "4000:4000"
    restart: unless-stopped

  cognitive:
    restart: "no"
