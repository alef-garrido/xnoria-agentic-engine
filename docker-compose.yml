services:

  # ---------------------------------------------------------------------------
  # Postgres — shared database for n8n and the filter service
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: exnoria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exnoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-exnoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./layers/orchestration/filter/db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"                         # exposed for local DB inspection only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exnoria -d ${POSTGRES_DB:-exnoria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exnoria_internal

  # ---------------------------------------------------------------------------
  # n8n — workflow orchestration engine
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: exnoria_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-exnoria}
      DB_POSTGRESDB_USER: exnoria
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Encryption
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Host config
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      # Execution settings
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: true
      # Disable telemetry
      N8N_DIAGNOSTICS_ENABLED: false
      N8N_VERSION_NOTIFICATIONS_ENABLED: false
      # Allow workflows to read env vars via $env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
      # -------------------------------------------------------------------------
      # Meta WhatsApp Business API
      # W3 · sal.contact.prioritize — readable inside workflows via $env
      # -------------------------------------------------------------------------
      META_WA_TOKEN: ${META_WA_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      SDR_WHATSAPP_NUMBER: ${SDR_WHATSAPP_NUMBER}
      # COM Publish variables
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN}
      # -------------------------------------------------------------------------
      # HubSpot
      # W1 · acq.lead.score  W2 · sal.sequence.enroll  W3 · sal.contact.prioritize
      # readable inside workflows via $env
      # -------------------------------------------------------------------------
      HUBSPOT_PRIVATE_APP_TOKEN: ${HUBSPOT_PRIVATE_APP_TOKEN}
      HUBSPOT_PORTAL_ID: ${HUBSPOT_PORTAL_ID}
      HUBSPOT_DEVELOPER_API_KEY: ${HUBSPOT_DEVELOPER_API_KEY}
      HUBSPOT_PERSONAL_ACCESS_KEY: ${HUBSPOT_PERSONAL_ACCESS_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - exnoria_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Filter service — deterministic allowlist enforcement
  # Uncomment when layers/orchestration/filter/ is ready (Phase 3)
  # ---------------------------------------------------------------------------
  filter:
    build:
      context: ./layers/orchestration/filter
      dockerfile: Dockerfile
    container_name: exnoria_filter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    environment:
      FILTER_PORT: ${FILTER_PORT:-3000}
      POSTGRES_URL: postgresql://exnoria:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exnoria}
      N8N_BASE_URL: http://n8n:5678
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OPERATOR_CHAT_ID: ${TELEGRAM_OPERATOR_CHAT_ID}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:4000}
      # COM_CONTENT_SHEET_ID — used by W-COM-1 · com.content.publish
      COM_CONTENT_SHEET_ID: ${COM_CONTENT_SHEET_ID}
    ports:
      - "${FILTER_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exnoria_internal

  # ---------------------------------------------------------------------------
  # MemPalace — Contact memory & semantic search (C3)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Cognitive layer — OpenClaw agentic core (persistent runtime)
  # ---------------------------------------------------------------------------
  cognitive:
    build:
      context: ./layers/cognitive
      dockerfile: Dockerfile
    container_name: exnoria_cognitive
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - engram_data:/root/.engram
      - ./layers/cognitive/dist:/app/dist
    depends_on:
      filter:
        condition: service_healthy
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      FILTER_URL: http://filter:3000
      POSTGRES_URL: postgresql://exnoria:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exnoria}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Phase 3 B3 — MemPalace MCP sidecar (temporarily disabled)
      # MEMPALACE_MCP_URL: http://mempalace:8080/sse
      # Phase 3 B3 — PostHog MCP (optional — cognitive degrades gracefully if not set)
      POSTHOG_AUTH_HEADER: ${POSTHOG_AUTH_HEADER:-Bearer phx_your_api_key_here}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
    networks:
      - exnoria_internal

  # ---------------------------------------------------------------------------
  # Dashboard — execution layer, CX Tool Dock
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./layers/dashboard
      dockerfile: Dockerfile
    container_name: exnoria_dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://exnoria:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exnoria}
      ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD}
      AUTH_SECRET: ${DASHBOARD_AUTH_SECRET}
      FILTER_URL: http://filter:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DASHBOARD_PORT:-4000}:4000"
    networks:
      - exnoria_internal

# -----------------------------------------------------------------------------
# Volumes — persistent data survives container restarts
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  engram_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks — all services communicate on an isolated internal network
# No service reaches another except through declared dependencies
# -----------------------------------------------------------------------------
networks:
  exnoria_internal:
    driver: bridge